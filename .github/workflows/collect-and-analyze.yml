name: Collect And Analyze Jobs

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6,18 * * *"

permissions:
  contents: write

concurrency:
  group: collect-and-analyze-jobs
  cancel-in-progress: false

jobs:
  collect-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build sync tool
        run: dotnet build Job.sln --configuration Release

      - name: Collect raw runs
        env:
          GOOGLE_CAREERS_LOCATIONS: ${{ vars.GOOGLE_CAREERS_LOCATIONS }}
          GOOGLE_CAREERS_SEARCH_TERM: ${{ vars.GOOGLE_CAREERS_SEARCH_TERM }}
          GOOGLE_CAREERS_MAX_PAGES: ${{ vars.GOOGLE_CAREERS_MAX_PAGES }}
          META_CAREERS_LIVE: "true"
          MICROSOFT_CAREERS_LIVE: "true"
          NVIDIA_CAREERS_LIVE: "true"
          NVIDIA_CAREERS_MAX_PAGES: "10"
          AMAZON_JOBS_LIVE: "true"
        run: |
          dotnet run --project scripts/GoogleCareersSync/GoogleCareersSync.csproj -- collect
          dotnet run --project scripts/GoogleCareersSync/GoogleCareersSync.csproj -- collect-meta
          dotnet run --project scripts/GoogleCareersSync/GoogleCareersSync.csproj -- collect-apple
          dotnet run --project scripts/GoogleCareersSync/GoogleCareersSync.csproj -- collect-microsoft
          dotnet run --project scripts/GoogleCareersSync/GoogleCareersSync.csproj -- collect-nvidia
          dotnet run --project scripts/GoogleCareersSync/GoogleCareersSync.csproj -- collect-amazon

      - name: Analyze latest runs
        env:
          GOOGLE_CAREERS_LOCATIONS: ${{ vars.GOOGLE_CAREERS_LOCATIONS }}
          GOOGLE_CAREERS_SEARCH_TERM: ${{ vars.GOOGLE_CAREERS_SEARCH_TERM }}
          GOOGLE_CAREERS_MAX_PAGES: ${{ vars.GOOGLE_CAREERS_MAX_PAGES }}
        run: |
          dotnet run --project scripts/GoogleCareersSync/GoogleCareersSync.csproj -- analyze-latest
          dotnet run --project scripts/GoogleCareersSync/GoogleCareersSync.csproj -- analyze-meta-latest
          dotnet run --project scripts/GoogleCareersSync/GoogleCareersSync.csproj -- analyze-apple-latest
          dotnet run --project scripts/GoogleCareersSync/GoogleCareersSync.csproj -- analyze-microsoft-latest
          dotnet run --project scripts/GoogleCareersSync/GoogleCareersSync.csproj -- analyze-nvidia-latest
          dotnet run --project scripts/GoogleCareersSync/GoogleCareersSync.csproj -- analyze-amazon-latest

      - name: Commit updated datasets
        run: |
          if git diff --quiet -- data data-raw; then
            echo "No data changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data data-raw
          git commit -m "chore: collect and analyze latest job data"
          git push origin "${{ github.event.repository.default_branch }}"
