name: Collect And Analyze Jobs

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6,18 * * *"

permissions:
  contents: write

concurrency:
  group: collect-and-analyze-jobs
  cancel-in-progress: false

jobs:
  collect-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build sync tool
        run: dotnet build Job.sln --configuration Release

      - name: Install Playwright Chromium
        run: pwsh scripts/GoogleCareersSync/bin/Release/net8.0/playwright.ps1 install --with-deps chromium

      - name: Collect raw runs
        env:
          GOOGLE_CAREERS_LOCATIONS: ${{ vars.GOOGLE_CAREERS_LOCATIONS }}
          GOOGLE_CAREERS_SEARCH_TERM: ${{ vars.GOOGLE_CAREERS_SEARCH_TERM }}
          GOOGLE_CAREERS_MAX_PAGES: "100"
          META_CAREERS_LIVE: "true"
          META_CAREERS_MAX_PAGES: "100"
          MICROSOFT_CAREERS_LIVE: "true"
          MICROSOFT_CAREERS_MAX_PAGES: "100"
          NVIDIA_CAREERS_LIVE: "true"
          NVIDIA_CAREERS_MAX_PAGES: "100"
          AMAZON_JOBS_LIVE: "true"
          AMAZON_JOBS_MAX_PAGES: "100"
          APPLE_JOBS_MAX_PAGES: "100"
          NETFLIX_JOBS_SEARCH_TERM: "Software Engineering"
          NETFLIX_JOBS_MAX_PAGES: "100"
          NETFLIX_JOBS_MAX_DETAILS: "1000"
        run: |
          status_file="$RUNNER_TEMP/collector-status.tsv"
          : > "$status_file"

          collect_source() {
            source="$1"
            command="$2"
            echo "::group::Collect $source"
            if timeout 20m dotnet run --project scripts/GoogleCareersSync/GoogleCareersSync.csproj -- "$command"; then
              printf '%s\tcollected\n' "$source" >> "$status_file"
            else
              exit_code=$?
              printf '%s\tcollection_failed\n' "$source" >> "$status_file"
              echo "::error title=$source collection failed::Collector exited with code $exit_code"
            fi
            echo "::endgroup::"
          }

          collect_source google collect
          collect_source meta collect-meta
          collect_source apple collect-apple
          collect_source microsoft collect-microsoft
          collect_source nvidia collect-nvidia
          collect_source amazon collect-amazon
          collect_source netflix collect-netflix
          collect_source uber collect-uber
          collect_source databricks collect-databricks
          collect_source stripe collect-stripe

      - name: Analyze latest runs
        env:
          GOOGLE_CAREERS_LOCATIONS: ${{ vars.GOOGLE_CAREERS_LOCATIONS }}
          GOOGLE_CAREERS_SEARCH_TERM: ${{ vars.GOOGLE_CAREERS_SEARCH_TERM }}
          GOOGLE_CAREERS_MAX_PAGES: ${{ vars.GOOGLE_CAREERS_MAX_PAGES }}
        run: |
          collection_status="$RUNNER_TEMP/collector-status.tsv"
          final_status="$RUNNER_TEMP/pipeline-status.tsv"
          : > "$final_status"

          analyze_source() {
            source="$1"
            command="$2"
            if ! grep -q "^${source}[[:space:]]collected$" "$collection_status"; then
              printf '%s\tcollection_failed\n' "$source" >> "$final_status"
              echo "Skipping $source analysis because collection failed."
              return
            fi

            echo "::group::Analyze $source"
            if timeout 10m dotnet run --project scripts/GoogleCareersSync/GoogleCareersSync.csproj -- "$command"; then
              printf '%s\tsuccess\n' "$source" >> "$final_status"
            else
              exit_code=$?
              printf '%s\tanalysis_failed\n' "$source" >> "$final_status"
              echo "::error title=$source analysis failed::Analyzer exited with code $exit_code"
            fi
            echo "::endgroup::"
          }

          analyze_source google analyze-latest
          analyze_source meta analyze-meta-latest
          analyze_source apple analyze-apple-latest
          analyze_source microsoft analyze-microsoft-latest
          analyze_source nvidia analyze-nvidia-latest
          analyze_source amazon analyze-amazon-latest
          analyze_source netflix analyze-netflix-latest
          analyze_source uber analyze-uber-latest
          analyze_source databricks analyze-databricks-latest
          analyze_source stripe analyze-stripe-latest

      - name: Commit updated datasets
        run: |
          if git diff --quiet -- data data-raw; then
            echo "No data changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data data-raw
          git commit -m "chore: collect and analyze latest job data"
          git push origin "${{ github.event.repository.default_branch }}"

      - name: Report collection status
        if: always()
        run: |
          status_file="$RUNNER_TEMP/pipeline-status.tsv"
          echo "## Collection summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Company | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"

          if [ ! -s "$status_file" ]; then
            echo "| Pipeline | Failed before collection completed |" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          while IFS=$'\t' read -r source result; do
            case "$result" in
              success) label="Success" ;;
              collection_failed) label="Collection failed" ;;
              analysis_failed) label="Analysis failed" ;;
              *) label="$result" ;;
            esac
            echo "| $source | $label |" >> "$GITHUB_STEP_SUMMARY"
          done < "$status_file"

          if grep -Eq $'\t(collection_failed|analysis_failed)$' "$status_file"; then
            echo "One or more company pipelines failed after successful results were preserved."
            exit 1
          fi
