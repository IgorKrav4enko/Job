<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Careers Tracker</title>
  <meta http-equiv="refresh" content="0; url=./google-careers-dashboard.html" />
  <style>
    :root {
      color-scheme: dark;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top right, rgba(56, 189, 248, 0.16), transparent 26%),
        radial-gradient(circle at top left, rgba(139, 92, 246, 0.16), transparent 24%),
        linear-gradient(180deg, #07111f 0%, #0b1627 40%, #08111d 100%);
      color: #e2e8f0;
      font: 16px/1.5 Inter, system-ui, sans-serif;
    }

    main {
      width: min(560px, calc(100vw - 32px));
      padding: 32px;
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 16px;
      background: rgba(17, 29, 45, 0.84);
      backdrop-filter: blur(18px);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 2rem;
      line-height: 1.1;
    }

    p {
      margin: 0;
      color: #94a3b8;
    }

    a {
      color: #4ade80;
    }
  </style>
  <script>
    window.location.replace("./google-careers-dashboard.html");
  </script>
</head>
<body>
  <main>
    <h1>Careers Tracker</h1>
    <p>Переходимо до дашборда. Якщо редірект не спрацював, відкрий <a href="./google-careers-dashboard.html">dashboard</a>.</p>
  </main>
</body>
</html>
